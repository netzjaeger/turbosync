name: Scheduled build

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
    inputs:
      force:
        description: "Build and release even if there is nothing new to sync"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: scheduled-build
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    outputs:
      should_build: ${{ steps.merge.outputs.has_new_commits == 'true' || github.event.inputs.force == 'true' }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ secrets.TARGET_REPO }}
          token: ${{ secrets.TARGET_PAT }}
          fetch-depth: 0

      - name: Configure bot identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge upstream source
        id: merge
        run: python3 scripts/ad-removal/sync_merge_upstream.py

      - name: Re-apply source policy
        if: steps.merge.outputs.has_new_commits == 'true'
        run: python3 scripts/ad-removal/remove_ad_monetization.py

      - name: Policy gate
        if: steps.merge.outputs.has_new_commits == 'true'
        run: python3 scripts/ad-removal/check_no_ad_code.py

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.merge.outputs.has_new_commits == 'true' || github.event.inputs.force == 'true'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies (needed to regenerate icons)
        if: steps.merge.outputs.has_new_commits == 'true'
        working-directory: app
        run: npm ci

      - name: Re-apply branding
        if: steps.merge.outputs.has_new_commits == 'true'
        run: python3 scripts/rebrand/apply_rebrand.py

      - name: Branding gate
        if: steps.merge.outputs.has_new_commits == 'true'
        run: python3 scripts/rebrand/check_no_old_branding.py

      - name: Commit any changes the policy scripts made
        if: steps.merge.outputs.has_new_commits == 'true'
        run: |
          if ! git diff --quiet || [ -n "$(git status --porcelain)" ]; then
            git add -A
            git diff --cached --quiet || git commit -m "chore: reapply source policy after sync"
          fi

      - name: Determine version
        id: version
        if: steps.merge.outputs.has_new_commits == 'true' || github.event.inputs.force == 'true'
        run: |
          VERSION=$(node -p "require('./app/package.json').version")
          DATE=$(date -u +%Y%m%d)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}-${DATE}" >> "$GITHUB_OUTPUT"

      - name: Push
        if: steps.merge.outputs.has_new_commits == 'true'
        run: git push origin HEAD:main

  create-draft-release:
    needs: sync
    if: needs.sync.outputs.should_build == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
    steps:
      - id: create
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          TAG: ${{ needs.sync.outputs.tag }}
          VERSION: ${{ needs.sync.outputs.version }}
          TARGET_REPO: ${{ secrets.TARGET_REPO }}
        with:
          github-token: ${{ secrets.TARGET_PAT }}
          script: |
            const [owner, repo] = process.env.TARGET_REPO.split('/');

            // The release tag is version + UTC date, so a same-day re-run
            // (e.g. retrying after a fix once the previous attempt failed,
            // or two dispatches overlapping under this workflow's
            // cancel-in-progress: false concurrency group) reuses the exact
            // same tag as an earlier run. A draft release doesn't create the
            // underlying git tag, so getReleaseByTag won't find it -- list
            // releases and match tag_name directly instead.
            //
            // An orphaned draft under this tag (e.g. cleanup-failed-release
            // didn't get to run, or hasn't finished yet) blocks this run's
            // own draft from ever publishing, since GitHub rejects
            // publishing a release whose tag_name any other release already
            // holds, draft or not. It's safe to delete and replace -- it was
            // never shipped. An already-published release under this tag
            // means a build for this exact version+date already shipped
            // successfully; don't delete real release history out from
            // under a maintainer, fail loudly instead so a human decides.
            const existing = await github.paginate(github.rest.repos.listReleases, { owner, repo })
              .then(releases => releases.find(r => r.tag_name === process.env.TAG));

            if (existing && !existing.draft) {
              core.setFailed(
                `Release ${existing.html_url} is already published under tag ${process.env.TAG}. ` +
                `Refusing to touch it -- if this run's rebuild is intentional, delete or retag that ` +
                `release by hand first.`
              );
              return;
            }
            if (existing) {
              await github.rest.repos.deleteRelease({ owner, repo, release_id: existing.id });
            }

            const { data: release } = await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: process.env.TAG,
              name: `${process.env.VERSION} (${process.env.TAG.split('-').pop()})`,
              body: 'Automated build.',
              draft: true,
              prerelease: false,
            });
            core.setOutput('release_id', release.id);

  verify:
    needs: sync
    if: needs.sync.outputs.should_build == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ secrets.TARGET_REPO }}
          ref: main
          token: ${{ secrets.TARGET_PAT }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libdbus-1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Install dependencies
        working-directory: app
        run: npm ci
      - name: Test
        working-directory: app
        run: npm test
      - name: Build
        working-directory: app
        run: npm run build:verify
      - name: Test native library
        working-directory: app/src-tauri
        run: cargo test --lib
      - name: Check formatting
        working-directory: app/src-tauri
        run: cargo fmt --all -- --check
      - name: Lint
        working-directory: app/src-tauri
        run: cargo clippy --lib --all-targets -- -D warnings

  build-mobile:
    needs: [sync, create-draft-release]
    if: needs.sync.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HAS_SIGNING_KEY: ${{ secrets.SIGNING_KEY_BASE64 != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ secrets.TARGET_REPO }}
          ref: main
          token: ${{ secrets.TARGET_PAT }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: ''
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: aarch64-linux-android
      - name: Install NDK
        env:
          NDK_VERSION: 30.0.14904198
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' "ndk;${NDK_VERSION}"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - name: Install dependencies
        working-directory: app
        run: npm ci
      - name: Reproduce project inputs
        working-directory: app
        run: |
          npm run tauri android init
          node scripts/apply-android-overrides.cjs
      - name: Configure release signing
        if: env.HAS_SIGNING_KEY == 'true'
        working-directory: app
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEY_ALIAS"
          test -n "$SIGNING_KEY_PASSWORD"
          test -n "$SIGNING_KEYSTORE_PASSWORD"
          printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          printf 'keyAlias=%s\nkeyPassword=%s\nstorePassword=%s\nstoreFile=%s\n' \
            "$SIGNING_KEY_ALIAS" "$SIGNING_KEY_PASSWORD" "$SIGNING_KEYSTORE_PASSWORD" "$RUNNER_TEMP/release.jks" \
            > src-tauri/gen/android/app/keystore.properties
      - name: Build package
        working-directory: app
        run: npm run tauri android build -- --target aarch64 --apk true --ci
      - name: Locate built package
        id: pkg
        run: |
          PKG=$(find app/src-tauri/gen/android/app/build/outputs/apk/arm64 -iname '*.apk' | head -n1)
          if [ -z "$PKG" ]; then
            PKG=$(find app/src-tauri/gen/android -iname '*.apk' | head -n1)
          fi
          test -n "$PKG"
          echo "path=$PKG" >> "$GITHUB_OUTPUT"
      - name: Verify bridge survived minification
        working-directory: app
        run: |
          SEEDS=$(find src-tauri/gen/android/app/build/outputs/mapping -iname 'seeds.txt' | head -n1)
          if [ -n "$SEEDS" ]; then
            npm run android:jni:check -- --generated --r8-seeds "$SEEDS"
          else
            npm run android:jni:check -- --generated
          fi
      - name: Upload package to draft release
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          PKG_PATH: ${{ steps.pkg.outputs.path }}
          RELEASE_ID: ${{ needs.create-draft-release.outputs.release_id }}
          TARGET_REPO: ${{ secrets.TARGET_REPO }}
        with:
          github-token: ${{ secrets.TARGET_PAT }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const [owner, repo] = process.env.TARGET_REPO.split('/');
            await github.rest.repos.uploadReleaseAsset({
              owner,
              repo,
              release_id: Number(process.env.RELEASE_ID),
              name: path.basename(process.env.PKG_PATH),
              data: fs.readFileSync(process.env.PKG_PATH),
            });

  build-desktop:
    needs: [sync, create-draft-release]
    if: needs.sync.outputs.should_build == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ secrets.TARGET_REPO }}
          ref: main
          token: ${{ secrets.TARGET_PAT }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libssl-dev libdbus-1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev rpm
      - name: Install dependencies
        working-directory: app
        run: npm ci
      - name: Build package
        working-directory: app
        run: npm run tauri build -- --bundles rpm
      - name: Locate built package
        id: pkg
        run: |
          PKG=$(find app/src-tauri/target/release/bundle/rpm -iname '*.rpm' | head -n1)
          test -n "$PKG"
          echo "path=$PKG" >> "$GITHUB_OUTPUT"
      - name: Upload package to draft release
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          PKG_PATH: ${{ steps.pkg.outputs.path }}
          RELEASE_ID: ${{ needs.create-draft-release.outputs.release_id }}
          TARGET_REPO: ${{ secrets.TARGET_REPO }}
        with:
          github-token: ${{ secrets.TARGET_PAT }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const [owner, repo] = process.env.TARGET_REPO.split('/');
            await github.rest.repos.uploadReleaseAsset({
              owner,
              repo,
              release_id: Number(process.env.RELEASE_ID),
              name: path.basename(process.env.PKG_PATH),
              data: fs.readFileSync(process.env.PKG_PATH),
            });

  publish-release:
    needs: [create-draft-release, verify, build-mobile, build-desktop]
    if: needs.verify.result == 'success' && needs.build-mobile.result == 'success' && needs.build-desktop.result == 'success'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          RELEASE_ID: ${{ needs.create-draft-release.outputs.release_id }}
          TARGET_REPO: ${{ secrets.TARGET_REPO }}
        with:
          github-token: ${{ secrets.TARGET_PAT }}
          script: |
            const [owner, repo] = process.env.TARGET_REPO.split('/');
            await github.rest.repos.updateRelease({
              owner,
              repo,
              release_id: Number(process.env.RELEASE_ID),
              draft: false,
              make_latest: 'true',
            });

  cleanup-failed-release:
    needs: [create-draft-release, verify, build-mobile, build-desktop]
    if: always() && needs.create-draft-release.result == 'success' && (needs.verify.result != 'success' || needs.build-mobile.result != 'success' || needs.build-desktop.result != 'success')
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          RELEASE_ID: ${{ needs.create-draft-release.outputs.release_id }}
          TARGET_REPO: ${{ secrets.TARGET_REPO }}
        with:
          github-token: ${{ secrets.TARGET_PAT }}
          script: |
            const [owner, repo] = process.env.TARGET_REPO.split('/');
            await github.rest.repos.deleteRelease({
              owner,
              repo,
              release_id: Number(process.env.RELEASE_ID),
            });
