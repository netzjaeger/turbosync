name: CI

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit to check out and test"
        required: false
        default: ""
  schedule:
    - cron: '23 9 * * 1'

permissions:
  contents: read

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ secrets.TARGET_REPO }}
          ref: ${{ github.event.inputs.sha || 'main' }}
          token: ${{ secrets.TARGET_PAT }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libdbus-1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Install dependencies
        working-directory: app
        run: npm ci
      - name: Test
        working-directory: app
        run: npm test
      - name: Validate localization resources
        working-directory: app
        run: npm run i18n:check
      - name: Build
        working-directory: app
        run: npm run build:verify
      - name: Test native library
        working-directory: app/src-tauri
        run: cargo test --lib
      - name: Check formatting
        working-directory: app/src-tauri
        run: cargo fmt --all -- --check
      - name: Lint
        working-directory: app/src-tauri
        run: cargo clippy --lib --all-targets -- -D warnings
      - name: Build native binary
        working-directory: app
        run: npm run tauri -- build --no-bundle

  e2e:
    name: End-to-end
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ secrets.TARGET_REPO }}
          ref: ${{ github.event.inputs.sha || 'main' }}
          token: ${{ secrets.TARGET_PAT }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        working-directory: app
        run: npm ci
      - name: Install browser
        working-directory: app
        run: npx playwright install --with-deps chromium
      - name: Run end-to-end tests
        working-directory: app
        run: npm run visual:test

  coverage-and-bundles:
    name: Coverage and bundles
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ secrets.TARGET_REPO }}
          ref: ${{ github.event.inputs.sha || 'main' }}
          token: ${{ secrets.TARGET_PAT }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        working-directory: app
        run: npm ci
      - name: Test with coverage floors
        working-directory: app
        run: npm run test:coverage
      - name: Build and enforce bundle budgets
        working-directory: app
        run: npm run build:verify

  native-coverage:
    name: Native coverage
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ secrets.TARGET_REPO }}
          ref: ${{ github.event.inputs.sha || 'main' }}
          token: ${{ secrets.TARGET_PAT }}
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libdbus-1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: llvm-tools-preview
      - name: Cache coverage tool
        id: cov-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cargo/bin/cargo-llvm-cov
          key: cargo-llvm-cov-0.8.7-${{ runner.os }}
      - name: Install coverage tool
        if: steps.cov-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-llvm-cov --locked --version 0.8.7
      - name: Collect coverage
        working-directory: app/src-tauri
        run: |
          mkdir -p coverage
          cargo llvm-cov --lib --lcov --output-path coverage/lcov.info --fail-under-lines 10
          cargo llvm-cov report --summary-only

  dependency-advisories:
    name: Dependency advisories and licenses
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        project: [app]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ secrets.TARGET_REPO }}
          ref: ${{ github.event.inputs.sha || 'main' }}
          token: ${{ secrets.TARGET_PAT }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: ${{ matrix.project }}
      - run: node scripts/check-npm-audit.cjs ${{ matrix.project }}
      - run: node scripts/check-node-licenses.cjs ${{ matrix.project }}

  script-contracts:
    name: Script contracts
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ secrets.TARGET_REPO }}
          ref: ${{ github.event.inputs.sha || 'main' }}
          token: ${{ secrets.TARGET_PAT }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: node scripts/test-assurance-scripts.cjs

  native-advisories:
    name: Native advisories and licenses
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ secrets.TARGET_REPO }}
          ref: ${{ github.event.inputs.sha || 'main' }}
          token: ${{ secrets.TARGET_PAT }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Cache policy tool
        id: deny-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-0.18.7-${{ runner.os }}
      - name: Install policy tool
        if: steps.deny-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-deny --locked --version 0.18.7
      - name: Validate expiring advisory baseline
        run: node scripts/check-rust-advisory-baseline.cjs
      - name: Check dependency policy
        run: cargo deny --manifest-path app/src-tauri/Cargo.toml check --config ../../deny.toml --hide-inclusion-graph

  report-status:
    name: Report result
    needs:
      - linux
      - e2e
      - coverage-and-bundles
      - native-coverage
      - dependency-advisories
      - script-contracts
      - native-advisories
    if: always() && (github.event.inputs.sha != '' && github.event.inputs.sha != null)
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          TARGET_REPO: ${{ secrets.TARGET_REPO }}
        with:
          github-token: ${{ secrets.TARGET_PAT }}
          script: |
            const [owner, repo] = process.env.TARGET_REPO.split('/');
            const results = ${{ toJSON(needs) }};
            const failed = Object.values(results).some(j => j.result !== 'success');
            await github.rest.repos.createCommitStatus({
              owner,
              repo,
              sha: '${{ github.event.inputs.sha }}',
              state: failed ? 'failure' : 'success',
              context: 'ci',
              description: failed ? 'One or more checks failed' : 'All checks passed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
